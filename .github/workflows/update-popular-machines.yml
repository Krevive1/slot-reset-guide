name: Update popular machines

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-popular-machines
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch Search Console data
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: node scripts/update-popular-machines.mjs

      - name: Commit if data changed
        run: |
          if git diff --quiet -- data/popular-machines.json; then
            echo "No change in data/popular-machines.json, skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/popular-machines.json
          git commit -m "chore: update popular machines from Search Console"
          git push
